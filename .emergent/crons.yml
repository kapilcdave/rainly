crons:
  - name: raincheck-tick
    description: "Checks hedge prices and odds for alerts, places season-plan hedges, syncs Kalshi orders and settles hedges"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/tick"
    method: POST
    enabled: true
